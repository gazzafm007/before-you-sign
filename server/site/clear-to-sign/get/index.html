<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Clear to Sign by ARPRA</title>
<meta name="description" content="Download Clear to Sign by ARPRA, the free app that checks NSW land lease community documents before you sign.">
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/site.css">
<style>
body{background:var(--sky);}
.box{max-width:560px;margin:40px auto;padding:32px 28px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:center;}
.box img.app{width:96px;height:96px;border-radius:22px;}
.box h1{font-size:1.6em;margin:.6em 0 .2em;}
.box .by{color:var(--ink-soft);font-weight:700;margin:0 0 1em;}
.stores{display:flex;flex-direction:column;gap:14px;margin:22px 0 10px;}
.stores a{display:block;padding:16px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;font-size:1.05em;}
.stores a[aria-disabled]{background:#9AA3B5;pointer-events:none;}
.note{font-size:.85em;color:var(--ink-soft);}
</style>
</head>
<body>
<main class="box" id="main">
  <img class="app" src="../assets/clear-to-sign-icon.png" alt="">
  <h1>Clear to Sign</h1>
  <p class="by">by ARPRA</p>
  <p>Free app: check your NSW land lease community paperwork before you sign.</p>
  <p id="going" class="note" hidden>Taking you to the store…</p>
  <div class="stores">
    <a id="android" href="#">Get it on Google Play</a>
    <a id="ios" href="#">Download on the App Store</a>
  </div>
  <p class="note">No smartphone? <a href="https://www.arpra.org.au">Check your documents online</a> or call ARPRA on <a href="tel:1300798399">1300 798 399</a>.</p>
  <p class="note"><a href="../">Help</a> · <a href="../privacy.html">Privacy</a></p>
</main>
<script>
/* Store links. Edit here if they change; the QR code stays the same. */
var STORES = {
  android: "https://play.google.com/store/apps/details?id=com.arpra.cleartosign",
  ios: ""   /* set when Apple approves: https://apps.apple.com/au/app/id<Apple ID> */
};
(function(){
  ['android','ios'].forEach(function(k){
    var a=document.getElementById(k);
    if(STORES[k]){ a.href=STORES[k]; } else { a.setAttribute('aria-disabled','true'); a.removeAttribute('href'); a.textContent += ' — coming soon'; }
  });
  var ua=navigator.userAgent||'';
  var target = /Android/i.test(ua) ? STORES.android :
    ((/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)) ? STORES.ios : '');
  if(target && !/[?&]stay=1/.test(location.search)){
    document.getElementById('going').hidden=false;
    setTimeout(function(){ location.replace(target); }, 600);
  }
})();
</script>
</body>
</html>
